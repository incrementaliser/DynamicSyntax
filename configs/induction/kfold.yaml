data:
  # Single corpus file to shuffle and split (holdout / train_val_test / kfold)
  corpus: data/induction-test/train.txt
  # Split mode: holdout | train_val_test | kfold | pre_split
  split: kfold
  # Number of disjoint folds (k-fold CV)
  folds: 3
  # Shuffle seed before fold assignment
  seed: 47
  # Write train/test corpora under each fold_*/data/
  save_splits: true

model:
  # Directory with computational-actions.txt (read in place; not copied)
  seed_grammar: resources/2025-seed-grammar
  # If true, continue learning from previous_model; if false, learn from scratch
  use_previous_model: false
  # Directory that directly contains lexicon-top-N.txt (typically a prior run's models/); used only when use_previous_model is true
  previous_model: null
  # Number of top lexicon ranks to save / evaluate up to
  top_n: 2

train:
  # Show EM learning progress bar
  show_progress: true
  # Always train and overwrite lexicons in the current output dir (no warning); wins over reuse_existing_model
  force_train: false
  # If true and current-dir lexicons exist and force_train is false, skip EM and reuse them for eval
  reuse_existing_model: false

eval:
  # Splits to score, e.g. [test], [val, test], or [train, test] (omit train to skip train-set eval)
  evaluate_on: [test]
  # Inclusive start of top-N ranks to evaluate
  top_n_start: 1
  # Inclusive end of top-N ranks (null → model.top_n)
  top_n_end: null

logging:
  # Log level: DEBUG | INFO | WARNING | ERROR (loguru + stdlib intercept)
  level: INFO
  # Print logs to the CLI (stderr)
  to_cli: true
  # Write logs to run_dir/logs/<file_name>
  to_file: true
  # Log file name under run_dir/logs/
  file_name: run.log

output:
  # Parent directory for timestamped run folders
  run_dir: out/runs
  # Run folder suffix: run_dir/<timestamp>_<name>/ (each fold also gets fold_i/full_run_report.txt + eval-scores.tsv)
  name: induction-kfold
  # Write eval-scores.tsv (per-fold and top-level average)
  write_tsv: true
  # Write full_run_report.txt (per-fold and top-level average)
  write_report: true
